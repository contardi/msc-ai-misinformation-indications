seed: 42

model:
  primary: bertugues
  max_length: 256

train:
  epochs: 4
  batch_size: 16
  learning_rate: 2.0e-5
  early_stopping_patience: 2

eval:
  cv_folds: 10
  confidence: 0.95

baselines:
  logreg:
    C: 1.0
    max_iter: 1000
  svm:
    C: 1.0
    max_iter: 5000
  random_forest:
    n_estimators: 300
    min_samples_leaf: 1
    max_features: sqrt

llm:
  provider: maritaca
  base_url: https://chat.maritaca.ai/api
  model: sabiazinho-4
  temperature: 0.0
  max_tokens: 16
  timeout_seconds: 60
  max_calls: 20000
  pricing:
    sabiazinho-4: {input: 1.0, output: 4.0}
    sabia-4: {input: 5.0, output: 20.0}
